name: Recover stale GitHub Pages deployment

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/clear-stale-pages-deployment.yml"
  workflow_dispatch:
    inputs:
      deployment_sha:
        description: "Commit SHA of the stale GitHub Pages deployment"
        required: true
        default: "6414ccdf1d1d03c3ec9eef3943527c3cc9404740"
        type: string

permissions:
  contents: read
  pages: write
  deployments: write

jobs:
  recover-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel the stale GitHub Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.deployment_sha || '6414ccdf1d1d03c3ec9eef3943527c3cc9404740' }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Expected a full 40-character commit SHA."
            exit 1
          fi

          echo "Cancelling stale Pages deployment for $TARGET_SHA..."
          if cancel_output="$(gh api --method POST \
            "repos/$REPOSITORY/pages/deployments/$TARGET_SHA/cancel" 2>&1)"; then
            echo "GitHub Pages accepted the cancellation request."
          elif grep -qi "as it's finished" <<< "$cancel_output"; then
            echo "Pages API reports the Pages deployment is finished; continuing with stale deployment-record cleanup."
          else
            echo "::error::Pages deployment cancellation failed: $cancel_output"
            exit 1
          fi

      - name: Remove the stale inactive deployment record
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.deployment_sha || '6414ccdf1d1d03c3ec9eef3943527c3cc9404740' }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          deployments="$(gh api --paginate "repos/$REPOSITORY/deployments?sha=$TARGET_SHA&environment=github-pages&per_page=100")"
          count="$(jq 'length' <<< "$deployments")"
          echo "Found $count generic deployment record(s) for the stale SHA."

          while IFS= read -r deployment_id; do
            [[ -n "$deployment_id" ]] || continue
            echo "Marking deployment $deployment_id inactive..."
            gh api --method POST --silent \
              "repos/$REPOSITORY/deployments/$deployment_id/statuses" \
              -f state=inactive \
              -f description="Stale GitHub Pages deployment recovery"

            echo "Deleting inactive deployment record $deployment_id..."
            gh api --method DELETE --silent \
              "repos/$REPOSITORY/deployments/$deployment_id"
          done < <(jq -r '.[].id' <<< "$deployments")

      - name: Queue a fresh GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST --silent "repos/$REPOSITORY/pages/builds"
          echo "A fresh build of the latest main revision has been queued."
