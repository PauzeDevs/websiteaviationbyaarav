name: Daily aviation newsroom

on:
  schedule:
    - cron: "30 2 * * *" # 08:00 India Standard Time
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data/news.json"
      - "articles/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: aviation-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate source syntax and HTML output
        run: |
          python -m py_compile scripts/fetch_news.py
          node --check assets/app.js
          node --check assets/ambient-scene.js
          python - <<'PY'
          from pathlib import Path
          import sys
          html_files = list(Path('.').rglob('*.html'))
          bad = []
          for path in html_files:
              content = path.read_text(encoding='utf-8')
              if r'\n' in content:
                  bad.append(str(path))
          if bad:
              print('Literal \\n escape found in HTML:', ', '.join(bad))
              sys.exit(1)
          logo = Path('assets/file_000000008260821183c81398641a4ae8.png')
          if not logo.is_file():
              print('Original transparent logo is missing')
              sys.exit(1)
          print(f'Validated {len(html_files)} HTML files and the original logo.')
          PY
      - name: Collect aviation headlines and build attributed report pages
        run: python scripts/fetch_news.py
      - name: Validate refreshed reports and original-source links
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("data/news.json").read_text(encoding="utf-8"))
          stories = data if isinstance(data, list) else data.get("articles", data.get("stories", []))
          pages = list(Path("articles").glob("*.html"))
          if not stories:
              raise SystemExit("News collector returned no aviation stories.")
          if not pages:
              raise SystemExit("No individual report pages were generated.")
          missing = []
          for page in pages:
              content = page.read_text(encoding="utf-8")
              if "Read the complete original report" not in content or "Source credit:" not in content:
                  missing.append(str(page))
          if missing:
              raise SystemExit("Report page is missing attribution or original-source link: " + ", ".join(missing))
          print(f"Validated {len(stories)} news records and {len(pages)} attributed report pages.")
          PY
      - name: Commit refreshed newsroom data and article pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json articles/
          if git diff --cached --quiet; then
            echo "Newsroom content is unchanged."
          else
            git commit -m "(news): refresh aviation news and attributed report pages"
            git pull --rebase -X theirs origin main
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
