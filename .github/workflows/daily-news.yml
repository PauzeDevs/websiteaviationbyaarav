name: Daily aviation newsroom

on:
  schedule:
    - cron: "30 2 * * *" # 08:00 India Standard Time
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data/news.json"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: aviation-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect aviation headlines
        run: python scripts/fetch_news.py
      - name: Commit refreshed news feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if ! git diff --cached --quiet; then
            git commit -m "(chore): refresh daily aviation news"
            git push
          else
            echo "News feed unchanged."
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
