name: Daily aviation newsroom

on:
  schedule:
    - cron: "30 2 * * *" # 08:00 India Standard Time
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data/news.json"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: aviation-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect aviation headlines and build story pages
        run: python scripts/fetch_news.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
