name: Daily aviation newsroom

on:
  schedule:
    - cron: "30 2 * * *" # 08:00 India Standard Time
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data/news.json"
      - "articles/**"
      - "originals/**"
      - "data/original-reports.json"
      - ".github/workflows/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: aviation-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate source syntax and HTML output
        run: |
          python -m py_compile scripts/fetch_news.py
          node --check assets/app.js
          node --check assets/ambient-scene.js
          node --check assets/templeNightRenderer.js
          node --check assets/aircraft-scene.js
          python - <<'PY'
          from pathlib import Path
          import sys
          html_files = list(Path('.').rglob('*.html'))
          bad = []
          for path in html_files:
              content = path.read_text(encoding='utf-8')
              if r'\\n' in content:
                  bad.append(str(path))
          if bad:
              print('Literal \\n escape found in HTML:', ', '.join(bad))
              sys.exit(1)
          logo = Path('assets/aviation-by-aarav-logo.svg')
          if not logo.is_file() or '<svg' not in logo.read_text(encoding='utf-8'):
              print('Transparent SVG brand logo is missing or invalid')
              sys.exit(1)
          license = Path('THREEUI-LICENSE.md')
          renderer = Path('assets/templeNightRenderer.js')
          if not renderer.is_file() or 'createTempleNightRenderer' not in renderer.read_text(encoding='utf-8'):
              print('ThreeUI Temple Night renderer is missing or invalid')
              sys.exit(1)
          if not license.is_file() or 'MIT License' not in license.read_text(encoding='utf-8'):
              print('ThreeUI MIT license attribution is missing')
              sys.exit(1)
          print(f'Validated {len(html_files)} HTML files, the transparent SVG brand logo, and the Temple Night renderer/license.')
          PY
      - name: Collect aviation headlines and build attributed report pages
        run: python scripts/fetch_news.py
      - name: Test AI newsroom helpers
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Research and write original aviation reports (non-blocking)
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
        run: python scripts/generate_original_reports.py
      - name: Validate generated original reports
        run: |
          python -m py_compile scripts/generate_original_reports.py
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("data/original-reports.json").read_text(encoding="utf-8"))
          for item in data.get("articles", []):
              page = Path(item["url"])
              if not page.is_file():
                  raise SystemExit(f"Missing original report page: {page}")
              if not item.get("image", "").startswith("https://"):
                  raise SystemExit(f"Original report has no photo: {item.get('title')}")
              body = page.read_text(encoding="utf-8")
              if 'class="report-hero"' not in body or "<img" not in body:
                  raise SystemExit(f"Original report has no hero photo: {page}")
              for required in ("Sources & further reading", "What we could not verify", "ORIGINAL AVIATION BY AARAV REPORT"):
                  if required not in body:
                      raise SystemExit(f"{page} is missing required editorial section: {page}")
          print(f"Validated {len(data.get('articles', []))} original report(s).")
          PY
      - name: Validate refreshed reports and original-source links
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("data/news.json").read_text(encoding="utf-8"))
          stories = data if isinstance(data, list) else data.get("articles", data.get("stories", []))
          pages = list(Path("articles").glob("*.html"))
          if not stories:
              raise SystemExit("News collector returned no aviation stories.")
          if not pages:
              raise SystemExit("No individual report pages were generated.")
          missing = []
          for page in pages:
              content = page.read_text(encoding="utf-8")
              if "Read the complete original report" not in content or "Source credit:" not in content:
                  missing.append(str(page))
          if missing:
              raise SystemExit("Report page is missing attribution or original-source link: " + ", ".join(missing))
          print(f"Validated {len(stories)} news records and {len(pages)} attributed report pages.")
          PY
      - name: Commit refreshed newsroom data and article pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data/news.json articles/ originals/ data/original-reports.json
          if git diff --cached --quiet; then
            echo "Newsroom content is unchanged."
          else
            git commit -m "(news): refresh aviation news and attributed report pages"
            pushed=false
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase -X theirs origin/main
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
              echo "Push raced with another commit (attempt $attempt/3); retrying."
              sleep 2
            done
            if [ "$pushed" != true ]; then
              echo "Could not publish newsroom update after 3 attempts."
              exit 1
            fi
          fi
      - name: Finish newsroom publication
        run: echo "Newsroom content committed. GitHub Pages handles deployment from the main branch."
