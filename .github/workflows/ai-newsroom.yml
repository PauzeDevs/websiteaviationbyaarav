name: AI newsroom drafts

on:
  workflow_run:
    workflows: ["Daily aviation newsroom"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: aviation-ai-newsroom
  cancel-in-progress: false

jobs:
  prepare-editorial-drafts:
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the latest main branch
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Require OpenAI API key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Add OPENAI_API_KEY under Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Research and write original aviation reports
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
        run: python scripts/generate_original_reports.py
      - name: Validate generated editorial drafts
        run: |
          python -m py_compile scripts/generate_original_reports.py
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("data/original-reports.json").read_text(encoding="utf-8"))
          for item in data.get("articles", []):
              page = Path(item["url"])
              if not page.is_file():
                  raise SystemExit(f"Missing original report page: {page}")
              text = page.read_text(encoding="utf-8")
              for required in ("Sources & further reading", "What we could not verify", "ORIGINAL AVIATION BY AARAV REPORT"):
                  if required not in text:
                      raise SystemExit(f"{page} is missing required editorial section: {required}")
          print(f"Validated {len(data.get('articles', []))} original report record(s).")
          PY
      - name: Open or update a draft pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: bot/ai-newsroom-drafts
          delete-branch: false
          draft: true
          title: "(newsroom): review original Aviation by Aarav reports"
          commit-message: "(newsroom): prepare AI-assisted original report drafts"
          add-paths: |
            originals/
            data/original-reports.json
          body: |
            ## Editorial review required

            This draft PR contains original Aviation by Aarav reports researched from multiple independent publishers.

            - Check every factual statement against the linked source material.
            - Review dates, names, numbers, aircraft specifications and attribution.
            - Confirm the article does not overstate what sources establish.
            - Correct or remove any unsupported passage before merging.

            These reports are not published automatically. Merge only after human editorial approval.

            Generated by the AI newsroom workflow.
